<script>
(function () {

  /* ══════════════ 1. CONFIGURACIÓN (edita aquí) ══════════════ */

    phones: ['+51 996 989 580', '+51 984 757 668', '+51 961 711 421'],

  };

  var LINES = {
    clasica: { label: 'Línea Clásica', short: 'Clásica', emoji: '🔥', price: 3 },
    premium: { label: 'Línea Premium · Edición Dorada', short: 'Premium', emoji: '👑', price: 5 }
  };

  var FLAVORS = [
    { id: 'carne', name: 'Carne', emoji: '🥩',
      desc: 'Carne molida sazonada con cebolla, ajo, comino y pimienta, cubierta por masa crujiente y dorada. Ideal con un toque de salsa picante o limón al gusto.' },
    { id: 'pollo', name: 'Pollo', emoji: '🍗',
      desc: 'Rellena de pollo sazonado y semi jugoso: un bocado tradicional y reconfortante, con masa crujiente.' },
    { id: 'mixta', name: 'Mixta', emoji: '🌟',
      desc: 'Salchicha, queso y un toque de orégano, envueltos en masa crujiente. Un trío de sabores que te hará sonreír.' }

  /* ══════════════ 2. UTILIDADES ══════════════ */

  var root = $('pnb'), launcher = $('pnb-launcher'), teaser = $('pnb-teaser'), panel = $('pnb-panel'),

  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function money(n) { return 'S/. ' + n.toFixed(2); }
  function norm(s) { return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9\s/]/g, ' ').replace(/\s+/g, ' ').trim(); }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function waLink(text) { return 'https://wa.me/' + CONFIG.whatsapp + (text ? '?text=' + encodeURIComponent(text) : ''); }
  function scrollDown() { log.scrollTop = log.scrollHeight; }
  function store(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
  function stored(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function lev(a, b) {                       // distancia de edición (tolera 1 error de tipeo)
    if (Math.abs(a.length - b.length) > 1) return 2;
    var prev = [], i, j, cur;
    for (j = 0; j <= b.length; j++) prev[j] = j;
    for (i = 1; i <= a.length; i++) {
      cur = [i];
      for (j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = cur;
    }
    return prev[b.length];
  }
  function flavorById(id) { return FLAVORS.filter(function (f) { return f.id === id; })[0]; }
  function tidyName(s) {
    s = s.replace(/[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ' .-]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 60);
    if (s === s.toLowerCase() || s === s.toUpperCase()) s = s.toLowerCase().replace(/(^|\s)([a-záéíóúüñ])/g, function (m, a, b) { return a + b.toUpperCase(); });
    return s;
  }

  var PRODUCTS = [];
  Object.keys(LINES).forEach(function (lineId) {
    FLAVORS.forEach(function (f) {
      PRODUCTS.push({ id: f.id + '-' + lineId, line: lineId, flavor: f,
        name: 'Empanada de ' + f.name + (lineId === 'premium' ? ' Premium' : ''), price: LINES[lineId].price });
    });
  });

  /* ══════════════ 3. ESTADO ══════════════ */
  var mode = null;   // null | cart | line | flavor | qty | name | when | delivery | address | note
  var cart = {};     // { 'carne-clasica': 2, ... }
  var order = newOrder();
  var pend = { lines: [], qty: 0, flavors: [], ack: [] };   // datos a medio entender
  var cartUI = null, leadMsg = '';
  var started = false, unknownCount = 0, history = [];
  var queue = Promise.resolve();

  function newOrder() { return { active: false, name: '', when: '', time: '', date: null, soon: false, delivery: '', address: '', note: '', defaultLine: null }; }
  function resetPend() { pend = { lines: [], qty: 0, flavors: [], ack: [] }; }
  function totals() {
    var u = 0, t = 0;
    PRODUCTS.forEach(function (p) { var q = cart[p.id] || 0; u += q; t += q * p.price; });
    return { units: u, total: t };
  }
  function L(html) { if (leadMsg) { html = leadMsg + '<br>' + html; leadMsg = ''; } return html; }

  /* ══════════════ 4. RENDER DE MENSAJES ══════════════ */
  function rowFor(who) { var r = el('div', 'pnb-row pnb-' + who); log.appendChild(r); return r; }
  function addUser(text) { rowFor('user').appendChild(el('div', 'pnb-bubble', text)); history.push({ role: 'user', content: text }); scrollDown(); }
  function addBotHTML(html) { var b = el('div', 'pnb-bubble'); b.innerHTML = html; rowFor('bot').appendChild(b); scrollDown(); }
  function addBotText(text) { rowFor('bot').appendChild(el('div', 'pnb-bubble', text)); history.push({ role: 'assistant', content: text }); scrollDown(); }
  function addBotNode(node) { node.classList.add('pnb-wide'); rowFor('bot').appendChild(node); scrollDown(); }

  function typing(on) {
    var t = $('pnb-typing');
    if (on && !t) {
      var r = rowFor('bot'); r.id = 'pnb-typing';
      var b = el('div', 'pnb-bubble pnb-typing'); b.innerHTML = '<i></i><i></i><i></i>'; r.appendChild(b); scrollDown();
    } else if (!on && t) { t.remove(); }
  }

  // parts: strings (HTML de confianza) o funciones que devuelven un nodo
  function say(parts, chips) {
    queue = queue.then(function () {
      var chain = Promise.resolve();
      parts.forEach(function (p) {
        chain = chain.then(function () {
          typing(true);
          return sleep(220 + Math.min(380, (typeof p === 'string' ? p.length : 60) * 2.5));
        }).then(function () {
          typing(false);
          if (typeof p === 'function') addBotNode(p()); else { addBotHTML(p); history.push({ role: 'assistant', content: p.replace(/<[^>]+>/g, ' ') }); }
        });
      });
      return chain.then(function () { setChips(chips === undefined ? CHIPS.main : chips); });
    });
    return queue;
  }

  function setChips(list) {
    chipsBox.textContent = '';
    (list || []).forEach(function (c) {
      var b = el('button', 'pnb-chip', c.label); b.type = 'button';
      b.addEventListener('click', function () {
        addUser(c.label); setChips([]);
        if (c.run) c.run(); else respond(c.intent);
      });
      chipsBox.appendChild(b);
    });
  }

  var CHIPS = {
    main: [
      { label: '🔥 Sábado ninja', intent: 'horario' }, { label: '🛒 Hacer pedido', run: orderChip },
      { label: '🥟 Menú y precios', intent: 'menu' }, { label: '🎉 Eventos (25+)', intent: 'mayor' },

  /* ══════════════ 5. LECTURA DEL PEDIDO ESCRITO (cantidades, sabores, línea, fecha) ══════════════ */
  var NUMW = { un: 1, uno: 1, una: 1, dos: 2, tres: 3, cuatro: 4, cinco: 5, seis: 6, siete: 7, ocho: 8, nueve: 9, diez: 10, once: 11, doce: 12,
    trece: 13, catorce: 14, quince: 15, veinte: 20, veinticinco: 25, treinta: 30, cuarenta: 40, cincuenta: 50, sesenta: 60, setenta: 70, ochenta: 80, noventa: 90, cien: 100, ciento: 100 };
  var FL_MAP = { carne: 'carne', carnes: 'carne', res: 'carne', pollo: 'pollo', pollos: 'pollo', pollito: 'pollo',
    mixta: 'mixta', mixtas: 'mixta', mixto: 'mixta', mixtos: 'mixta', salchicha: 'mixta', salchichas: 'mixta' };
  var LN_MAP = { premium: 'premium', premiums: 'premium', dorada: 'premium', doradas: 'premium', dorado: 'premium',
    clasica: 'clasica', clasicas: 'clasica', clasico: 'clasica', clasicos: 'clasica', normal: 'clasica', normales: 'clasica', tradicional: 'clasica', tradicionales: 'clasica' };
  var MON_N = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  var DAYS_N = ['domingo', 'lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado'];
  var DAYS_L = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  var REPLACE_RE = /\b(mejor|cambia|cambiar|cambialo|solo|solamente|nomas|en total|en vez|mas bien|corrige|corregir)\b/;
  var MON_RE = MON_N.join('|') + '|setiembre';

  function lineFromText(n) {     // línea mencionada en el texto (por nombre o por precio)
    var m = null;
    if (/\bs\/ ?5\b|\b5 soles\b/.test(n)) return 'premium';
    if (/\bs\/ ?3\b|\b3 soles\b/.test(n)) return 'clasica';
    n.split(' ').forEach(function (t) { if (LN_MAP[t]) m = m || LN_MAP[t]; });
    return m;
  }

  function stripNoise(n) {       // quita fechas, horas, precios y "x días/personas" para no confundirlos con cantidades
    return n.replace(/\b\d{1,2} ?\/ ?\d{1,2}( ?\/ ?\d{2,4})?\b/g, ' ')
      .replace(new RegExp('\\b\\d{1,2} (de )?(' + MON_RE + ')\\b', 'g'), ' ')
      .replace(/\ba las? \d{1,2}( \d{2})?( ?(am|pm))?\b/g, ' ')
      .replace(/\b\d{1,2}( \d{2})? ?(am|pm)\b/g, ' ')
      .replace(/\bs\/ ?\d+( 00)?\b/g, ' ').replace(/\b\d+ soles\b/g, ' ')
      .replace(/\b(\d+|un|una|dos|tres|cuatro|cinco|seis|siete) (dias?|horas?|personas?|semanas?)\b/g, ' ')
      .replace(/\bel \d{1,2}\b/g, ' ');
  }
  function prepNums(n) {
    n = n.replace(/\bmedias? docenas?\b/g, ' 6 ');
    n = n.replace(/\b(\d+|[a-z]+) docenas?\b/g, function (m, a) { var v = /^\d+$/.test(a) ? +a : NUMW[a]; return v ? ' ' + (v * 12) + ' ' : m; });
    return n.replace(/\bdocenas?\b/g, ' 12 ');
  }

  // Devuelve { items:[{flavor,qty,line}], looseQty:[], looseFlavors:[], line }
  function parseOrder(text) {
    var n = norm(text), priceLine = lineFromText(n);
    n = prepNums(stripNoise(n));
    var toks = n.split(' ').filter(Boolean).map(function (t) {
      var m = /^x?(\d+)x?$/.exec(t); if (m) return m[1];
      return NUMW[t] != null ? String(NUMW[t]) : t;
    });
    var flav = [], nums = [], lns = [];
    toks.forEach(function (t, i) {
      if (FL_MAP[t]) flav.push({ i: i, id: FL_MAP[t] });
      else if (/^\d+$/.test(t)) { var v = +t; if (v >= 1 && v <= 500) nums.push({ i: i, v: v, used: false }); }
      else if (LN_MAP[t]) lns.push({ i: i, line: LN_MAP[t] });
    });
    flav.forEach(function (f, fi) {
      var prevF = flav[fi - 1] ? flav[fi - 1].i : -1, nextF = flav[fi + 1] ? flav[fi + 1].i : 1e9, best = null;
      nums.forEach(function (nu) { var d = f.i - nu.i; if (!nu.used && d >= 1 && d <= 4 && nu.i > prevF && (!best || d < best.d)) best = { nu: nu, d: d }; });
      if (!best) nums.forEach(function (nu) { var d = nu.i - f.i; if (!nu.used && d >= 1 && d <= 3 && nu.i < nextF && (!best || d < best.d)) best = { nu: nu, d: d }; });
      if (best) { best.nu.used = true; f.qty = best.nu.v; }
    });
    var unpairedF = flav.filter(function (f) { return !f.qty; }), freeN = nums.filter(function (x) { return !x.used; });
    if (flav.length === 1 && unpairedF.length === 1 && freeN.length === 1) { unpairedF[0].qty = freeN[0].v; freeN[0].used = true; freeN = []; unpairedF = []; }

    // línea de cada sabor = la mencionada más cerca de él
    var distinct = {}; lns.forEach(function (l) { distinct[l.line] = 1; });
    if (priceLine) distinct[priceLine] = 1;
    var keys = Object.keys(distinct), globalLine = keys.length === 1 ? keys[0] : null;
    lns.forEach(function (l) {
      var near = null, nd = 99;
      flav.forEach(function (f) { var d = Math.abs(f.i - l.i); if (d < nd) { nd = d; near = f; } });
      if (near && nd <= 3 && !near.line) near.line = l.line;
    });

    var items = flav.filter(function (f) { return f.qty; }).map(function (f) { return { flavor: f.id, qty: f.qty, line: f.line || null }; });
    var looseFlavors = unpairedF.map(function (f) { return f.id; });
    return { items: items, looseQty: freeN.map(function (x) { return x.v; }), looseFlavors: looseFlavors, line: globalLine };
  }

  /* — fechas y horas — */
  function today0() { var d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function addDays(d, k) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + k); }
  function fmtDate(d) { return DAYS_L[d.getDay()] + ' ' + pad(d.getDate()) + '/' + pad(d.getMonth() + 1); }
  function nextSaturday() { var d = addDays(today0(), premiumUnits() ? CONFIG.minAdvanceDays : 1); while (d.getDay() !== 6) d = addDays(d, 1); return d; }
  function parseTime(n) {
    var tm = /\ba las? (\d{1,2})(?: (\d{2}))?(?: ?(am|pm|de la manana|de la tarde|de la noche))?\b/.exec(n) || /\b(\d{1,2})(?: (\d{2}))? ?(am|pm)\b/.exec(n);
    if (!tm) return '';
    var h = +tm[1], mi = tm[2] || '00', ap = tm[3] || '';
    if (h > 23) return '';
    if (/pm|tarde|noche/.test(ap) && h < 12) h += 12;
    else if (!ap && h >= 1 && h <= 6) h += 12;
    if (/am|manana/.test(ap) && h === 12) h = 0;
    return pad(h) + ':' + mi;
  }
  function parseWhen(text, strict) {
    var n = norm(text), t0 = today0(), d = null, m, i, time = parseTime(n);
    n = n.replace(/\b(por|en|de|a) la manana\b/g, ' ');
    if (/\bpasado manana\b/.test(n)) d = addDays(t0, 2);
    else if (/\bmanana\b/.test(n)) d = addDays(t0, 1);
    else if (/\bhoy\b/.test(n)) d = t0;
    if (!d && (m = /\b(\d{1,2}) ?\/ ?(\d{1,2})(?: ?\/ ?(\d{2,4}))?\b/.exec(n))) {
      var dd = +m[1], mm = +m[2] - 1;
      if (dd >= 1 && dd <= 31 && mm >= 0 && mm <= 11) {
        var yy = m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : t0.getFullYear();
        d = new Date(yy, mm, dd); if (!m[3] && d < t0) d = new Date(yy + 1, mm, dd);
      }
    }
    if (!d && (m = new RegExp('\\b(\\d{1,2}) (?:de )?(' + MON_RE + ')\\b').exec(n))) {
      var mi2 = m[2] === 'setiembre' ? 8 : MON_N.indexOf(m[2]), y2 = t0.getFullYear();
      d = new Date(y2, mi2, +m[1]); if (d < t0) d = new Date(y2 + 1, mi2, +m[1]);
    }
    if (!d) for (i = 0; i < 7; i++) {
      if (new RegExp('\\b' + DAYS_N[i] + 's?\\b').test(n)) { var diff = (i - t0.getDay() + 7) % 7; if (diff === 0) diff = 7; d = addDays(t0, diff); break; }
    }
    if (!d && strict && (m = /^(?:el )?(\d{1,2})$/.exec(n)) && +m[1] >= 1 && +m[1] <= 31) {
      d = new Date(t0.getFullYear(), t0.getMonth(), +m[1]); if (d < t0) d = new Date(t0.getFullYear(), t0.getMonth() + 1, +m[1]);
    }
    if (!d && !time) return null;
    return { date: d, time: time, label: d ? fmtDate(d) : '', soon: d ? (d - t0) / 86400000 < CONFIG.minAdvanceDays : false };
  }
  function whenLabel() { return order.when + (order.time && order.when !== 'Por coordinar' ? ' · ' + order.time : ''); }
  function setWhen(w) {
    if (w.date) { order.when = w.label; order.soon = w.soon; order.date = w.date; }
    if (w.time) order.time = w.time;
  }

  function parseDelivery(text) {
    var n = norm(text);
    if (/\b(recojo|recoger|recogerlo|recogerlas|recoger[eé]|paso por|yo voy|voy a buscar|en tienda|en el local)\b/.test(n)) return 'recojo';
    if (/\b(delivery|domicilio|envio|enviar|enviarlo|enviarme|llevar|lleven|llevenlo|llevarlo|traer|traigan|a mi casa)\b/.test(n)) return 'delivery';
    return null;
  }
  function looksLikeAddress(text) { return /\d/.test(text) || /\b(av|avenida|calle|jr|jiron|urb|urbanizacion|barrio|plaza|pasaje|psje|mz|lote|cerca|frente)\b/.test(norm(text)); }
  function cutName(s) {
    var parts = s.split(/\s+/), out = [], stop = /^(para|el|la|los|las|y|que|quiero|con|de|del|por|a|en|un|una|mi|me|necesito|pedido|delivery|recojo)$/i;
    for (var i = 0; i < parts.length && out.length < 3; i++) { if (stop.test(parts[i])) break; out.push(parts[i]); }
    return out.join(' ');
  }
  function extractExtras(text) {
    var out = {}, w = parseWhen(text, false), pd = parseDelivery(text);
    if (w) out.when = w;
    if (pd) out.delivery = pd;
    var m = /(?:a nombre de|me llamo|mi nombre es|soy)\s+([A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+(?:\s+[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+){0,3})/i.exec(text);
    if (m) { var nm = cutName(m[1]); if (nm && !/^(de|del|el|la|un|una)$/i.test(nm.split(' ')[0])) out.name = nm; }
    var am = /\b((?:av|avenida|calle|jr|jiron|urb|urbanizacion|pasaje|psje|plaza|barrio)\b\.?\s+[^;]+)$/i.exec(text);
    if (am) { out.address = am[1].split(/\s+para\s+/i)[0].trim().slice(0, 160); if (!out.delivery) out.delivery = 'delivery'; }
    return out;
  }
  function applyExtras(ex) {
    if (ex.name && !order.name) setName(ex.name);
    if (ex.when && !order.when) setWhen(ex.when); else if (ex.when && ex.when.time && !order.time) order.time = ex.when.time;
    if (ex.delivery && !order.delivery) order.delivery = ex.delivery;
    if (ex.address && order.delivery === 'delivery' && !order.address) order.address = ex.address;
  }

  function detect(text) {
    var n = norm(text), tokens = n.split(' '), best = null, bestScore = 0;
    INTENTS.forEach(function (it) {
      var s = 0;
      it.keys.forEach(function (k) {
        if (k.indexOf(' ') > -1) { if (n.indexOf(k) > -1) s += 2 * k.split(' ').length; return; }
        var hit = tokens.some(function (t) {
          return t === k || (k.length >= 5 && (t.indexOf(k) === 0 || (t.length >= 5 && lev(t, k) <= 1)));
        });
        if (hit) s += k.length >= 5 ? 2 : 1.5;
      });
      if (s > bestScore) { bestScore = s; best = it; }
    });
    return bestScore >= 1.5 ? best : null;
  }

    say(out.parts, chips);

  // Agrega (o reemplaza) cantidad de un sabor. Si no se sabe la línea, queda pendiente de preguntar.
  function putItem(flavorId, line, qty, replace) {
    var k = flavorId + '-' + line, f = flavorById(flavorId);
    cart[k] = replace ? Math.min(500, qty) : Math.min(500, (cart[k] || 0) + qty);
    return (replace ? '' : '') + qty + ' × ' + f.name + ' ' + LINES[line].short + ' (' + money(qty * LINES[line].price) + ')';
  }
  function addItem(flavorId, qty, line, replace) {
    line = line || order.defaultLine;
    if (!line) { pend.lines.push({ flavor: flavorId, qty: qty, replace: !!replace }); return; }
    pend.ack.push(putItem(flavorId, line, qty, replace));
  }
  function absorb(po, text) {
    var replace = REPLACE_RE.test(norm(text));
    if (po.line) order.defaultLine = po.line;
    po.items.forEach(function (it) {
      if (it.line && !order.defaultLine) order.defaultLine = it.line;
      addItem(it.flavor, it.qty, it.line || po.line, replace);
    });
    if (!po.items.length) {
      if (po.looseQty.length === 1 && !po.looseFlavors.length) pend.qty = po.looseQty[0];
      else if (po.looseFlavors.length && !po.looseQty.length) pend.flavors = po.looseFlavors.slice();
    }
  }

  function cartWidget() {

      Object.keys(LINES).forEach(function (lid) {

        segBtns[lid].textContent = LINES[lid].emoji + ' ' + LINES[lid].short + ' ' + money(LINES[lid].price).replace('.00', '') + (u ? ' · ' + u : '');

        q.value = cart[id] || 0; q.setAttribute('aria-label', 'Cantidad de ' + f.name);

        minus.setAttribute('aria-label', 'Quitar ' + f.name); plus.setAttribute('aria-label', 'Agregar ' + f.name);

        q.addEventListener('change', function () { set(parseInt(q.value, 10)); });

    } else {

    });
    out.push('Total: ' + t.units + ' empanadas · ' + money(t.total), '👤 Nombre: ' + order.name, '📅 Fecha: ' + whenLabel());
    if (orderKind()) out.push('📌 Tipo: ' + orderKind());
    out.push('🚚 Entrega: ' + deliveryText());
    if (order.note) out.push('📝 Nota: ' + order.note);
    out.push('💳 Pago: por Yape (anticipado). Por favor confírmenme monto y número.');
    return out.join('\n');
  }

  function showSummary() {
    mode = null;
    var rl = checkRules(), blocked = rl.block.length > 0, url = waLink(waText());
    function fixChips() {
      var c = [];
      if (rl.needUnits) c.push({ label: '➕ Agregar empanadas', run: function () { mode = 'cart'; say(['Te faltan <b>' + rl.needUnits + '</b> para llegar a ' + CONFIG.weekdayMin + ' 👇', cartWidget], []); } });
      c.push({ label: '📅 Elegir otra fecha', run: function () { order.when = ''; order.time = ''; order.date = null; order.soon = false; nextStep(); } });
      c.push({ label: '🔥 Pasar al próximo sábado', run: function () { var s = nextSaturday(); setWhen({ date: s, time: '', label: fmtDate(s), soon: false }); showSummary(); } });
      c.push({ label: '💬 Consultar por WhatsApp', run: function () {
        window.open(waLink('Hola, quisiera consultar sobre un pedido de empanadas 🥟'), '_blank', 'noopener');
        say(['Abrí WhatsApp en otra pestaña 💬 Aquí sigo por si quieres ajustar algo.'], fixChips());
      } });
      c.push({ label: '✖ Cancelar', run: cancelOrder });
      return c;
    }
    say([L(blocked ? 'Casi listo 🥷 pero hay un detalle por ajustar 👇' : 'Así quedó tu pedido 👇'), function () {
      var t = totals(), card = el('div', 'pnb-cart'); card.appendChild(el('div', 'pnb-cart-h', 'Resumen del pedido'));
      var ul = el('ul', 'pnb-sum');
      PRODUCTS.forEach(function (p) { var q = cart[p.id] || 0; if (q > 0) ul.appendChild(el('li', null, q + ' × ' + p.flavor.name + ' ' + LINES[p.line].short + ' — ' + money(q * p.price))); });
      card.appendChild(ul);
      var tr = el('div', 'pnb-total'); tr.appendChild(el('span', null, 'Total · ' + t.units + ' emp.')); tr.appendChild(el('span', null, money(t.total))); card.appendChild(tr);
      card.appendChild(el('div', 'pnb-kv', '👤 ' + order.name));
      card.appendChild(el('div', 'pnb-kv', '📅 ' + whenLabel()));
      card.appendChild(el('div', 'pnb-kv', '🚚 ' + deliveryText()));
      if (order.note) card.appendChild(el('div', 'pnb-kv', '📝 ' + order.note));
      rl.block.forEach(function (m) { var w = el('div', 'pnb-warn'); w.innerHTML = '⚠️ ' + m; card.appendChild(w); });
      rl.info.forEach(function (m) { var k = el('div', 'pnb-kv'); k.innerHTML = m; card.appendChild(k); });
      if (!blocked) {
        var y = el('div', 'pnb-yape'); y.innerHTML = '💳 <b>Pago por Yape</b> (anticipado): al enviar tu pedido por WhatsApp te confirmamos monto y número.'; card.appendChild(y);
        var fl = el('ul', 'pnb-flow');
        ['Envías el pedido por <b>WhatsApp</b>', 'El equipo confirma <b>disponibilidad</b>', 'Pagas por <b>Yape</b> (pago anticipado)', '¡Horneamos y recibes tus empanadas <b>calientitas</b>! 🔥'].forEach(function (s, i) {
          var li = el('li'); li.innerHTML = '<b class=\"n\">' + (i + 1) + '</b><span>' + s + '</span>'; fl.appendChild(li);
        });
        card.appendChild(fl);
        var a = el('a', 'pnb-btn pnb-wa', '📲 Enviar pedido por WhatsApp'); a.href = url; a.target = '_blank'; a.rel = 'noopener';
        a.addEventListener('click', function () {
          setTimeout(function () { say(['¡Misión enviada! 🥷🔥 En WhatsApp solo pulsa <b>enviar</b>. El equipo te confirma y te pasa el número de Yape.'], CHIPS.after); }, 500);
        });
        card.appendChild(a);
      }
      return card;
    }].concat(blocked ? [] : ['Tu pedido <b>se confirma cuando lo envías por WhatsApp</b>: ahí el equipo valida disponibilidad, coordina la entrega y te indica el pago por Yape.']),
    blocked ? fixChips() : [
      { label: '✏️ Productos', run: function () { mode = 'cart'; say(['Ajusta tus empanadas 👇', cartWidget], []); } },
      { label: '✏️ Nombre', run: function () { order.name = ''; nextStep(); } },
      { label: '✏️ Fecha', run: function () { order.when = ''; order.time = ''; order.date = null; order.soon = false; nextStep(); } },
      { label: '✏️ Entrega', run: function () { order.delivery = ''; order.address = ''; nextStep(); } },
      { label: '📝 Nota', run: askNote },
      { label: '✖ Cancelar', run: cancelOrder }]);
  }

  function quote(po) {
    var parts = [], units = 0, byLine = { clasica: 0, premium: 0 }, lines = [];
    if (po.items.length) {
      po.items.forEach(function (it) {
        units += it.qty; var f = flavorById(it.flavor), l = it.line || po.line;
        if (l) { byLine[l] += it.qty * LINES[l].price; lines.push(it.qty + ' × ' + f.name + ' ' + LINES[l].short + ' = ' + money(it.qty * LINES[l].price)); }
        else { byLine.clasica += it.qty * 3; byLine.premium += it.qty * 5; lines.push(it.qty + ' × ' + f.name); }
      });
    } else { units = po.looseQty[0]; byLine.clasica = units * LINES.clasica.price; byLine.premium = units * LINES.premium.price; }
    var anyFixed = po.items.length && po.items.every(function (it) { return it.line || po.line; });
    if (anyFixed) parts.push('💰 <b>' + units + ' empanadas</b><br>' + lines.join('<br>') + '<br><b>Total: ' + money(byLine.clasica + byLine.premium) + '</b>');
    else parts.push('💰 <b>' + units + ' empanadas</b><br>🔥 Clásica: <b>' + money(byLine.clasica) + '</b><br>👑 Premium: <b>' + money(byLine.premium) + '</b>');
    say(parts, [{ label: '🛒 Pedir esto', run: function () { orderFromText(po, {}, ''); } }, { label: '🥟 Ver menú', intent: 'menu' }, { label: '📞 Contacto', intent: 'contacto' }]);
  }

  /* ══════════════ 8. ENTRADA DEL USUARIO ══════════════ */
  function fallback(text) {
    unknownCount++;
    var wa = '<a href="' + waLink('Hola, tengo una consulta: ' + text) + '" target="_blank" rel="noopener">hablar con el equipo por WhatsApp</a>';
    say(['No estoy seguro de haberte entendido 🤔 Puedo ayudarte con <b>menú, precios, horarios, delivery y pedidos</b>. Prueba: <i>"20 de carne clásica para el sábado"</i>.' +
         (unknownCount >= 2 ? '<br>Si prefieres, puedes ' + wa + '.' : '')], order.active ? chipsAfterAnswer() : CHIPS.main);
  }

  function askAI(text) {
    var ctl = new AbortController(), timer = setTimeout(function () { ctl.abort(); }, 12000);
    typing(true);
    return fetch(CONFIG.aiEndpoint, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: ctl.signal,
      body: JSON.stringify({ message: text, history: history.slice(-8) })
    }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) {
        typing(false);
        if (d && typeof d.reply === 'string' && d.reply.trim()) { addBotText(d.reply.slice(0, 1200)); setChips(CHIPS.after); }
        else fallback(text);
      }).catch(function () { typing(false); fallback(text); })
      .then(function () { clearTimeout(timer); });
  }

  // ¿El texto es una pregunta suelta en medio del pedido (y no la respuesta esperada)?
  function isSideQuestion(text) {
    var it = detect(text); if (!it || it.id === 'pedido' || it.id === 'saludo' || it.id === 'gracias') return false;
    var words = text.trim().split(/\s+/).length, q = /\?/.test(text);
    if (mode === 'name') return q || words >= 4;
    if (mode === 'when') return !parseWhen(text, true) && (q || words >= 4);
    if (mode === 'delivery') return !parseDelivery(text) && (q || words >= 4);
    return q;
  }

  function handleMode(text) {
    var n = norm(text);
    if (isSideQuestion(text)) { answerIntent(detect(text), text); reask(); return; }
    switch (mode) {
      case 'name': setName(text); nextStep(); break;
      case 'when': {
        var w = parseWhen(text, true);
        if (w && w.date) { setWhen(w); afterWhen(); nextStep(); }
        else if (w && w.time) { order.time = w.time; say(['Anoté la hora <b>' + w.time + '</b> ✅ ¿Y para qué <b>día</b>?'], [{ label: '📅 ' + fmtDate(nextSaturday()), run: function () { setWhen({ date: nextSaturday(), time: '', label: fmtDate(nextSaturday()), soon: false }); afterWhen(); nextStep(); } }]); }
        else if (/coordin|despues|luego|no se|aun no|whatsapp/.test(n)) { order.when = 'Por coordinar'; nextStep(); }
        else { order.when = text.slice(0, 100); order.soon = false; nextStep(); }
        break;
      }
      case 'delivery': {
        var pd = parseDelivery(text);
        if (pd) { order.delivery = pd; if (pd === 'delivery' && looksLikeAddress(text)) order.address = text.slice(0, 160); }
        else if (looksLikeAddress(text)) { order.delivery = 'delivery'; order.address = text.slice(0, 160); }
        else if (/coordin|whatsapp/.test(n)) order.delivery = 'coordinar';
        else { say(['Elige una opción 👇'], [{ label: '🛵 Delivery', run: function () { order.delivery = 'delivery'; nextStep(); } }, { label: '🏠 Recojo en tienda', run: function () { order.delivery = 'recojo'; nextStep(); } }]); return; }
        nextStep(); break;
      }
      case 'address': order.address = /coordin|whatsapp/.test(n) ? 'Por coordinar' : text.slice(0, 160); nextStep(); break;
      case 'note': order.note = /^(no|nada|ninguna|sin nota|ninguno)$/.test(n) ? '' : text.slice(0, 200); nextStep(); break;
      case 'line': { var l = lineFromText(n); if (l) chooseLine(l); else askLine(); break; }
      case 'flavor': {
        var po = parseOrder(text);
        if (po.looseFlavors.length) chooseFlavor(po.looseFlavors[0]);
        else if (/repart|varios|surtid|de todo/.test(n)) { var q = pend.qty; resetPend(); showCartWidget('Reparte tus <b>' + q + ' empanadas</b> entre los sabores 👇'); }
        else askFlavor();
        break;
      }
      case 'qty': { var pq = parseOrder(text); if (pq.looseQty.length) chooseQty(pq.looseQty[0]); else askQty(); break; }
    }
  }

  function handleCartText(text) {
    var n = norm(text);
    if (/^(listo|continuar|continuo|seguir|siguiente|ya|ok|okey|eso es todo|eso|nada mas|confirmar|confirmo|vale|dale|ya esta)$/.test(n)) { if (!totals().units) { say(['Aún no elegiste ninguna empanada 🥟 Escribe algo como <i>"10 de carne"</i> o usa los botones <b>+</b>.'], []); return; } cartUI && cartUI.go(); return; }
    var po = parseOrder(text), ex = extractExtras(text);
    if (po.items.length || po.looseQty.length === 1 || po.looseFlavors.length) { applyExtras(ex); absorb(po, text); resolvePending(); return; }
    var it = detect(text);
    if (it && it.id !== 'pedido') { answerIntent(it, text); reask(); return; }
    say(['Puedes escribirme algo como <i>"10 de carne y 5 de pollo"</i> o usar los botones. Cuando termines, pulsa <b>Continuar</b> (o escribe "listo").'], []);
  }

  var ORDER_VERB = /\b(quiero|quisiera|necesito|pedir|pido|encargar|encargo|reservar|comprar|llevar|llevo|dame|ponme|mandame|me das|separame)\b/;
  var PRICE_Q = /\b(precio|precios|cuesta|cuestan|cuanto|costo|sale|salen|vale|valen|total)\b/;

  function handle(text) {
    var n = norm(text);
    if (order.active && /^(cancelar|cancela|salir|anular|olvidalo|olvidalo todo|ya no)$/.test(n)) { cancelOrder(); return; }
    if (mode === 'cart') { handleCartText(text); return; }
    var po = parseOrder(text), ex = extractExtras(text);
    if (mode) {
      if (po.items.length) { applyExtras(ex); absorb(po, text); resolvePending(); return; }   // corrige/agrega productos en cualquier paso
      handleMode(text); return;
    }
    // modo libre
    if (PRICE_Q.test(n) && /\b(las|los) de (3|5)\b/.test(n) && !po.items.length) { respond('precio'); return; }
    if (PRICE_Q.test(n) && (po.items.length || po.looseQty.length === 1)) { quote(po); return; }
    if (po.items.length) {
      if (order.active && totals().units) { applyExtras(ex); absorb(po, text); resolvePending(); }   // ya había pedido: se agrega/ajusta
      else orderFromText(po, ex, text);
      return;
    }
    if ((po.looseQty.length === 1 || po.looseFlavors.length) && ORDER_VERB.test(n)) {
      if (order.active && totals().units) { applyExtras(ex); absorb(po, text); resolvePending(); } else orderFromText(po, ex, text);
      return;
    }
    if (order.active) {                                    // ajustes rápidos luego del resumen
      var ln = lineFromText(n);
      if (ln && /\b(mejor|cambia|cambiar|pasa|pasalo|todo|todas|todos|ya dije|dije)\b/.test(n) && totals().units) {
        var moved = {}; Object.keys(cart).forEach(function (k) { var id = k.split('-')[0]; moved[id + '-' + ln] = (moved[id + '-' + ln] || 0) + cart[k]; });
        cart = moved; order.defaultLine = ln; leadMsg = '✅ Listo, todo en línea ' + LINES[ln].short + '.'; showSummary(); return;
      }
      if (/\b(cambiar|cambia|corregir|editar) (el )?(nombre)\b/.test(n)) { order.name = ''; nextStep(); return; }
      if (/\b(cambiar|cambia|corregir|editar) (la )?(fecha|hora|dia)\b/.test(n)) { order.when = ''; order.time = ''; order.date = null; nextStep(); return; }
      if (/\b(cambiar|cambia|corregir|editar) (la )?(entrega|direccion)\b/.test(n)) { order.delivery = ''; order.address = ''; nextStep(); return; }
      if (/\b(cambiar|cambia|editar|modificar) (el )?(pedido|productos|cantidad|cantidades)\b/.test(n)) { mode = 'cart'; say(['Ajusta tus empanadas 👇', cartWidget], []); return; }
    }
    var it = detect(text);
    if (it) { answerIntent(it, text); return; }
    if (lineFromText(n) && !order.active) { respond('premium'); return; }
    if (CONFIG.aiEndpoint) { setChips([]); queue = queue.then(function () { return askAI(text); }); return; }
    fallback(text);
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = input.value.trim().slice(0, 300);
    if (!text) return;
    input.value = ''; addUser(text); setChips([]); handle(text);
  });

  /* ══════════════ 9. APERTURA / CIERRE ══════════════ */
  function greet() {
    var sat = today0().getDay() === 6;
    say(['¡Hola, guerrero/a del antojo! 🥷 Soy el <b>Sensei Ninja</b>, asistente de <b>Plan Ninja Empanada</b>.',
         sat ? '🔥 <b>¡Hoy es Sábado Ninja!</b> Las empanadas salen desde las <b>' + CONFIG.saturdayHour + '</b>, recién horneadas y bien calientitas.'
             : '🔥 Nuestra próxima hornada es el <b>' + fmtDate(bakeDay()) + ' desde las ' + CONFIG.saturdayHour + '</b>, recién horneadas y bien calientitas. ¡Puedes reservar las tuyas desde ya!',
         'Toca una opción 👇 o <b>escribe tu pedido directo</b>, por ejemplo: <i>\"20 de carne para el sábado\"</i>.'], CHIPS.main);
  }
  function open() {
    root.dataset.open = 'true'; panel.hidden = false; teaser.hidden = true;
    launcher.setAttribute('aria-expanded', 'true');
    if (!started) { started = true; greet(); }
    $('pnb-status').textContent = statusPill();
    setTimeout(function () { input.focus({ preventScroll: true }); }, 60);
  }
  function close() {
    root.dataset.open = 'false'; panel.hidden = true; launcher.setAttribute('aria-expanded', 'false'); launcher.focus();
  }
  function reset() {
    log.textContent = ''; setChips([]); mode = null; cart = {}; order = newOrder(); resetPend(); cartUI = null; leadMsg = '';
    history = []; unknownCount = 0; queue = Promise.resolve(); greet();
  }

  launcher.addEventListener('click', function () { root.dataset.open === 'true' ? close() : open(); });
  teaser.addEventListener('click', open);
  $('pnb-close').addEventListener('click', close);
  $('pnb-reset').addEventListener('click', reset);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && root.dataset.open === 'true') close(); });

  $('pnb-status').textContent = statusPill();
  teaser.textContent = today0().getDay() === 6 ? '¡Hoy es Sábado Ninja! 🔥 Empanadas calientitas desde las ' + CONFIG.saturdayHour : '¿Antojo de empanadas? 🥟 Reserva para el sábado ninja';
  if (!stored('pnb_teaser')) {
    setTimeout(function () {
      if (root.dataset.open === 'true') return;
      teaser.hidden = false; store('pnb_teaser', '1');
      setTimeout(function () { teaser.hidden = true; }, 9000);
    }, CONFIG.teaserDelayMs);
  }

  // API pública: window.PlanNinjaBot.open() / .close() / .ask('texto')
  window.PlanNinjaBot = {
    open: open, close: close,
    ask: function (t) { open(); addUser(String(t)); setChips([]); handle(String(t)); },
    config: CONFIG
  };
})();
</script>
